<!DOCTYPE html>
<html>
<head>
    <title>Fake Job Detection</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color:#f4f4f4;
            text-align:center;
            padding-top:50px;
        }

        .container{
            width:60%;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        textarea{
            width:90%;
            height:200px;
            padding:10px;
            font-size:16px;
            color:black;
            border:1px solid gray;
            border-radius:5px;
        }

        input[type=file]{
            margin-top:20px;
        }

        button{
            margin-top:20px;
            padding:10px 25px;
            background-color:#007bff;
            color:white;
            border:none;
            border-radius:5px;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background-color:#0056b3;
        }

        h1{
            margin-bottom:30px;
        }

        h2{
            margin-top:30px;
        }
    </style>
</head>

<body>

    <h1>Fake Job Posting Detection System</h1>

    <div class="container">

        <form action="/predict" method="POST" enctype="multipart/form-data">

            <textarea name="job_description"
            placeholder="Enter job description here...">{{ job_description }}</textarea>

            <br>

            <input type="file" name="image">

            <br>

            <button type="submit">Predict</button>

        </form>

        {% if prediction %}
            <h2>{{ prediction }}</h2>
        {% endif %}

    </div>

</body>
</html>
