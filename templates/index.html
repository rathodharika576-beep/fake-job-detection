<!DOCTYPE html>
<html>
<head>
    <title>Fake Job Detection</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #333;
        }

        form {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            width: 60%;
            margin: auto;
            box-shadow: 0px 0px 10px gray;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 10px;
            font-size: 16px;
            color: black;
            background-color: white;
            border: 2px solid black;
            border-radius: 5px;
            resize: none;
        }

        input[type="file"] {
            margin-top: 15px;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkblue;
        }

        h2 {
            margin-top: 20px;
            color: black;
        }

    </style>

</head>

<body>

    <h1>Fake Job Posting Detection System</h1>

    <form action="/predict" method="post" enctype="multipart/form-data">

        <textarea
            name="job_description"
            placeholder="Enter job description here..."
        ></textarea>

        <br><br>

        <input type="file" name="job_image">

        <br>

        <button type="submit">Predict</button>

    </form>

    <h2>
        {{ prediction_text }}
    </h2>

</body>
</html>
